apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "schedule-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Hangfire": {
        "Prefix": "schedule-service"
      },
      "Schedule": {
        "ReportAggregate": "http://report-aggregate-service",
        "PromotionRebate": "http://tgs-promotion-rebate",
        "PromotionRelief": "http://promotion-relief-money-service",
        "GameTypeRoundAggregate": "http://game-type-round-aggregate-service",
        "Brand": "http://brand-cert-api",
        "BrandGameProvider": "http://brand-game-provider-service"
      },
      "ProfitRebate": {
        "Url": "http://profit-rebate-service"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]

