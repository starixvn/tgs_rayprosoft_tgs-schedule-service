apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "schedule-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Hangfire": {
        "ConnectionString": "{{ .Values.connectionStrings.redis }}",
        "Prefix": "hangfire.postgres",
        "Schedule": { "SchedulePollingInterval": 15 }
      },
      "Schedule": {
        "ReportAggregate": "http://report-aggregate-service",
        "Promotion": "http://promotion-api",
        "PromotionRebate": "http://tgs-promotion-rebate",
        "PromotionRelief": "http://promotion-relief-money-service",
        "GameTypeRoundAggregate": "http://game-type-round-aggregate-service",
        "FillInPlayerBucket": "http://fill-in-player-bucket-service",
        "BrandGameProvider": "http://brand-game-provider-service",
        "Email": "{{ .Values.mail.url }}"
      },
      "ProfitRebate": {
        "Url": "http://profit-rebate-service"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]

